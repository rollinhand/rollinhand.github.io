name: Build and Deploy JBake Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5   # ← Von v4 auf v5 aktualisiert

      - name: Set up Java 21
        uses: actions/setup-java@v4  # ← v4 ist aktuell noch OK, aber v5 verfügbar
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install JBake
        run: |
          curl -L https://github.com/jbake-org/jbake/releases/download/v2.7.0-rc.7/jbake-2.7.0-rc.7-bin.zip -o jbake.zip
          unzip jbake.zip -d $HOME/jbake
          echo "$HOME/jbake/jbake-2.7.0-rc.7/bin" >> $GITHUB_PATH

      - name: Build with JBake
        run: jbake -b

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
